project:
  type: default
  output-dir: _output
  render:
    - index.qmd
    - konzept.qmd
    - glossar.qmd
    - quellen.qmd
    - termine/*.qmd
    - skripte/*.qmd
  resources:
    - Präsentationen/Termin-*/_output/**

lang: de
date: 2026-09-29
date-format: "D. MMMM YYYY"
format:
  html:
    toc: true
    toc-depth: 3
    number-sections: false
    embed-resources: true
    css: styles.css
    theme: cosmo
    link-external-newwindow: true
execute:
  enabled: false

bibliography: literatur.bib
reference-section-title: Literatur
